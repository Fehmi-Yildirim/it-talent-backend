services:
  postgres:
    image: postgres:17
    container_name: it-talent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: it_talent
    ports:
      - "5432:5432"
    volumes:
      - it_talent_postgres_data:/var/lib/postgresql/data

volumes:
  it_talent_postgres_data: